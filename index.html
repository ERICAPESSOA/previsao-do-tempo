<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Previsão do Tempo</title>
</head>

<body>
    <main class="app-container">
        <section class="weather-card" aria-label="Previsão do tempo">
            <form class="search-form" id="weather-form">
                <label for="cidade" class="visually-hidden">Digite a cidade</label>
                <input id="cidade" class="input-cidade" type="text" placeholder="Digite a cidade, ex.: Rio de Janeiro" />
                <button type="submit" class="btn-buscar" aria-label="Buscar clima">
                    <img class="lupa" src="https://www.svgrepo.com/show/390590/find-glass-minus-online-search-seo.svg" alt="Ícone de busca" />
                </button>
            </form>

            <article class="weather-info">
                <h1 class="cidade">Tempo em ...</h1>
                <p class="temp">Temperatura: --</p>
                <p class="umidade">Umidade: --</p>
                <p class="mensaje"></p>
            </article>
        </section>
    </main>

    <script src="javascript.js"></script>
</body>

</html>
